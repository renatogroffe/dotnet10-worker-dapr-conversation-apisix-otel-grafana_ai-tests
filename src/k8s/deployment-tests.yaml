apiVersion: apps/v1
kind: Deployment
metadata:
  name: workertestsconversation
spec:
  selector:
    matchLabels:
      app: workertestsconversation
  replicas: 1
  template:
    metadata:
      labels:
        app: workertestsconversation
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "workertestsconversation"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: workertestsconversation
          image: renatogroffe/dotnet10-worker-dapr-aitests:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
          - name: OTEL_SERVICE_NAME
            value: "worker-tests-conversation-01"
          - name: WaitingInSeconds
            value: "10"
          - name: Dapr__ConversationComponentId
            value: "foundry-llm"
          - name: GrafanaCloud__Zone
            value: ""
          - name: GrafanaCloud__InstanceId
            value: ""
          - name: GrafanaCloud__ApiKey
            value: ""
